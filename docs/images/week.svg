<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="A week of token use between two resets. Without a plan, usage climbs too fast, hits the weekly limit on Thursday, and work waits for the reset. With teamrig, the work is spread over the week: usage climbs evenly to 99.5%, each day's tasks get done, and deploys pause in the last hours before the reset.">
<title>A week of token use between two resets. Without a plan, usage climbs too fast, hits the weekly limit on Thursday, and work waits for the reset. With teamrig, the work is spread over the week: usage climbs evenly to 99.5%, each day's tasks get done, and deploys pause in the last hours before the reset.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.note{font-size:13px;fill:var(--muted)}.note.strong{fill:var(--fg)}.day{font-size:14px;fill:var(--muted)}
.result{font-size:16px;font-weight:600}.brand{fill:var(--purple)}
.area{fill:var(--purple);fill-opacity:.12}.usage{fill:none;stroke:var(--purple);stroke-width:2.6;stroke-linejoin:round}
.now{stroke:var(--purple);stroke-width:1.4;stroke-opacity:.7}
.limit{stroke:var(--fg);stroke-width:1.4;stroke-dasharray:6 5;stroke-opacity:.55}.axis{stroke:var(--line);stroke-width:1.2}
.hatch{stroke:var(--line);stroke-width:1.4}
.task{fill:none;stroke:var(--line)}.done{fill:var(--green)}
.rushed{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}.hit{fill:var(--fg)}
