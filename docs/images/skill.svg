<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-label="A procedure becomes a skill. In api's tab, api deploys and proves the new version serves; the first try hit a stale build lock, so it took a retry and some digging. It will run this again, so it writes the steps and the trap down as a skill, api-deploy, in the same turn, and its task's record names the skill. A week on, in the lead's tab, teamrig skills scorecard shows api-deploy loaded 6 times at 4.2 calls a run, against 11.5 by hand before it, and web-release never loaded while its procedure ran by hand 3 times, so the lead asks web why.">
<title>A procedure becomes a skill. In api's tab, api deploys and proves the new version serves; the first try hit a stale build lock, so it took a retry and some digging. It will run this again, so it writes the steps and the trap down as a skill, api-deploy, in the same turn, and its task's record names the skill. A week on, in the lead's tab, teamrig skills scorecard shows api-deploy loaded 6 times at 4.2 calls a run, against 11.5 by hand before it, and web-release never loaded while its procedure ran by hand 3 times, so the lead asks web why.</title>
