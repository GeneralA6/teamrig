<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-label="teamrig in your terminal: one window, one tab per session (lead, api, web, data, docs, tests). In the lead's tab you ask: Morning. What needs me? The lead answers: Two decisions, each with my pick: 1, data: Keep logs 30 days or 90? My pick: 30, it halves the storage. 2, web: Offer Google sign-in on the form? My pick: not yet, email first. Everything else is on plan. You reply: 1 yes, 2 yes. Beside the conversation, teamrig-pane lists the team's tasks: T12 Signup form, web, p1, due today, needs you. T13 Signup endpoint, api, p1, due today, working. T14 Log retention, data, p2, due Thu, needs you. T16 End-to-end tests, tests, p2, due Fri, working. T15 API docs, docs, p2, due Fri, not started. T11 Release notes, docs, p3, done.">
<title>teamrig in your terminal: one window, one tab per session (lead, api, web, data, docs, tests). In the lead's tab you ask: Morning. What needs me? The lead answers: Two decisions, each with my pick: 1, data: Keep logs 30 days or 90? My pick: 30, it halves the storage. 2, web: Offer Google sign-in on the form? My pick: not yet, email first. Everything else is on plan. You reply: 1 yes, 2 yes. Beside the conversation, teamrig-pane lists the team's tasks: T12 Signup form, web, p1, due today, needs you. T13 Signup endpoint, api, p1, due today, working. T14 Log retention, data, p2, due Thu, needs you. T16 End-to-end tests, tests, p2, due Fri, working. T15 API docs, docs, p2, due Fri, not started. T11 Release notes, docs, p3, done.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}.muted{fill:var(--muted)}.accent{fill:var(--purple)}.strong{font-weight:700}
.key{font-size:13.5px;fill:var(--muted)}
.window{fill:var(--bg);stroke:var(--line)}.strip{fill:var(--tile)}.tab{fill:var(--bg);stroke:var(--line)}
.rule,.box{fill:none;stroke:var(--line)}.bullet{fill:var(--muted)}
.working{fill:var(--green)}.needs{fill:var(--amber)}.open{fill:none;stroke:var(--muted);stroke-width:1.5}
.done{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
