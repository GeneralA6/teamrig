<text x="42" y="122" class="mono">Two decisions, each with my pick:</text>
<text x="42" y="154" class="mono muted">1</text>
<text x="62" y="154" class="mono accent">data</text>
<text x="114" y="154" class="mono">Keep logs 30 days or 90?</text>
<text x="114" y="176" class="mono muted">My pick: 30, it halves the storage.</text>
<text x="42" y="206" class="mono muted">2</text>
