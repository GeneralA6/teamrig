<text x="114" y="206" class="mono">Offer Google sign-in on the form?</text>
<text x="114" y="228" class="mono muted">My pick: not yet, email first.</text>
<circle cx="28.5" cy="257.5" r="3.5" class="bullet"/>
<text x="42" y="262" class="mono">Everything else is on plan.</text>
