<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-label="One task's trip in your terminal. In the lead's tab you type: Users need a password reset. The lead adds T17 Password reset for api, p1, due today, and it appears in teamrig-pane's list. In api's tab, api starts it, edits and tests, then lands it with teamrig integrate: it waits in line while web holds the lock, then rebases on main and pushes. web's task and then T17 turn done in the pane.">
<title>One task's trip in your terminal. In the lead's tab you type: Users need a password reset. The lead adds T17 Password reset for api, p1, due today, and it appears in teamrig-pane's list. In api's tab, api starts it, edits and tests, then lands it with teamrig integrate: it waits in line while web holds the lock, then rebases on main and pushes. web's task and then T17 turn done in the pane.</title>
