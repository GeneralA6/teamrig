<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="How teamrig works: 1. Tell the lead, what you want, in plain words. 2. It hires a team, and gives each member a job. 3. The team builds it, together, each in its own tab. 4. You get the result, the lead calls you back.">
<title>How teamrig works: 1. Tell the lead, what you want, in plain words. 2. It hires a team, and gives each member a job. 3. The team builds it, together, each in its own tab. 4. You get the result, the lead calls you back.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.steptitle{font-size:19px;font-weight:700}.sub{font-size:14.5px;fill:var(--muted)}
.halo.lead{fill:var(--purple);fill-opacity:.12}.halo.done{fill:var(--green);fill-opacity:.14}
.icon{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon.lead{stroke:var(--purple)}.icon.done{stroke:var(--green)}
.arrow{fill:none;stroke:var(--line);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style>
<circle cx="120" cy="58" r="46" class="halo lead"/>
<g transform="translate(100 38) scale(1.6666666666666667)" class="icon lead"><path d="M4 4.5h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9l-5 4v-4H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M7 9.5h10M7 13h6"/></g>
<text x="120" y="152" text-anchor="middle" class="steptitle">Tell the lead</text>
<text x="120" y="180" text-anchor="middle" class="sub">what you want, in plain words.</text>
<path d="m236 50 8 8-8 8" class="arrow"/>
<circle cx="360" cy="58" r="46" class="halo lead"/>
<g transform="translate(340 38) scale(1.6666666666666667)" class="icon lead"><circle cx="12" cy="5" r="2.6"/><circle cx="4.5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19.5" cy="19" r="2.2"/><path d="M12 7.6V16.8M10.6 7.2 5.6 17M13.4 7.2l5 9.8"/></g>
<text x="360" y="152" text-anchor="middle" class="steptitle">It hires a team</text>
<text x="360" y="180" text-anchor="middle" class="sub">and gives each member a job.</text>
<path d="m476 50 8 8-8 8" class="arrow"/>
<circle cx="600" cy="58" r="46" class="halo lead"/>
<g transform="translate(580 38) scale(1.6666666666666667)" class="icon lead"><rect x="2.5" y="8" width="13" height="12" rx="2"/><path d="M6 8V5.5a1.5 1.5 0 0 1 1.5-1.5h11A1.5 1.5 0 0 1 20 5.5v10a1.5 1.5 0 0 1-1.5 1.5H15.5"/><path d="M5.5 12.5h7M5.5 16h4.5"/></g>
<text x="600" y="152" text-anchor="middle" class="steptitle">The team builds it</text>
<text x="600" y="180" text-anchor="middle" class="sub">together, each in its own tab.</text>
<path d="m716 50 8 8-8 8" class="arrow"/>
<circle cx="840" cy="58" r="46" class="halo done"/>
<g transform="translate(820 38) scale(1.6666666666666667)" class="icon done"><circle cx="12" cy="12" r="9.5"/><path d="m7.5 12.3 3 3 6-6.6"/></g>
<text x="840" y="152" text-anchor="middle" class="steptitle">You get the result</text>
<text x="840" y="180" text-anchor="middle" class="sub">the lead calls you back.</text>
</svg>
