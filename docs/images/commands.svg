<svg xmlns="http://www.w3.org/2000/svg" width="600" height="348" viewBox="0 0 600 348" xml:space="preserve" role="img" aria-label="Four Claude Code tabs named lead, api, web and data. In the lead tab, the lead adds a task for api and one for web, and tells web its task is ready. In the web tab, web reads that note and starts its task.">
<title>Four Claude Code tabs named lead, api, web and data. In the lead tab, the lead adds a task for api and one for web, and tells web its task is ready. In the web tab, web reads that note and starts its task.</title>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;white-space:pre}</style>
<rect width="600" height="348" rx="8" fill="#1e1e1e" stroke="#3c3c3c"/>
<path d="M0 8a8 8 0 0 1 8-8h584a8 8 0 0 1 8 8v24h-600z" fill="#2d2d2d"/>
<rect x="7" y="6" width="76.6" height="26" rx="5" fill="#1e1e1e"/>
<circle cx="21" cy="19" r="4" fill="#569cd6"/>
<text x="32.7" y="23"><tspan fill="#ffffff">lead</tspan></text>
<circle cx="97.6" cy="19" r="4" fill="#8b8b8b"/>
<text x="109.4" y="23"><tspan fill="#8b8b8b">api</tspan></text>
<circle cx="166.5" cy="19" r="4" fill="#8b8b8b"/>
<text x="178.2" y="23"><tspan fill="#8b8b8b">web</tspan></text>
<circle cx="235.3" cy="19" r="4" fill="#8b8b8b"/>
<text x="247" y="23"><tspan fill="#8b8b8b">data</tspan></text>
<text x="14" y="50"><tspan fill="#8b8b8b">lead: a Claude Code session; Claude runs these commands</tspan></text>
<text x="14" y="72"><tspan fill="#569cd6">$ </tspan><tspan fill="#ffffff">teamrig add --title &quot;Saved-card API&quot; --tier 1 --owner api</tspan></text>
<text x="14" y="90"><tspan fill="#89d185">ADDED</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#4ec9b0">T1</tspan><tspan fill="#d4d4d4"> open, </tspan><tspan fill="#c586c0">tier 1</tspan><tspan fill="#d4d4d4">, owner api, from lead | Saved-card API</tspan></text>
<text x="14" y="116"><tspan fill="#569cd6">$ </tspan><tspan fill="#ffffff">teamrig add --title &quot;Card checkout page&quot; --tier 1 --owner web</tspan></text>
<text x="14" y="134"><tspan fill="#89d185">ADDED</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#4ec9b0">T2</tspan><tspan fill="#d4d4d4"> open, </tspan><tspan fill="#c586c0">tier 1</tspan><tspan fill="#d4d4d4">, owner web, from lead | Card checkout page</tspan></text>
<text x="14" y="160"><tspan fill="#569cd6">$ </tspan><tspan fill="#ffffff">teamrig inbox add --to web --text &quot;T2 is yours; it uses T1&apos;s API&quot;</tspan></text>
<text x="14" y="178"><tspan fill="#89d185">POSTED</tspan><tspan fill="#d4d4d4"> to web; web is reminded at its next prompt</tspan></text>
<line x1="0" y1="203" x2="600" y2="203" stroke="#3c3c3c"/>
<text x="14" y="221"><tspan fill="#8b8b8b">web: another Claude Code session</tspan></text>
<text x="14" y="243"><tspan fill="#569cd6">$ </tspan><tspan fill="#ffffff">teamrig inbox read</tspan></text>
<text x="14" y="261"><tspan fill="#8b8b8b">- 2026-10-12 09:06</tspan><tspan fill="#d4d4d4"> lead: </tspan><tspan fill="#4ec9b0">T2</tspan><tspan fill="#d4d4d4"> is yours; it uses </tspan><tspan fill="#4ec9b0">T1</tspan><tspan fill="#d4d4d4">&apos;s API</tspan></text>
<text x="14" y="279"><tspan fill="#89d185">READ</tspan><tspan fill="#d4d4d4"> web: 1 new line, shown above; new ones are shown at your next prompt</tspan></text>
<text x="14" y="305"><tspan fill="#569cd6">$ </tspan><tspan fill="#ffffff">teamrig set T2 --status in-progress</tspan></text>
<text x="14" y="323"><tspan fill="#89d185">SET</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#4ec9b0">T2</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#dcdcaa">in-progress</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#c586c0">tier 1</tspan><tspan fill="#d4d4d4">, owner web, from lead | Card checkout page</tspan></text>
</svg>
