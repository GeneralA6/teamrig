<svg xmlns="http://www.w3.org/2000/svg" width="960" height="196" viewBox="0 0 960 196" role="img" aria-label="Your lead plans the week from the tokens you have left. The tasks fill the days, most important first, until the plan reaches 99.5% of your weekly limit. The last 0.5% is kept for incidents, and the task that doesn't fit moves to next week.">
<title>Your lead plans the week from the tokens you have left. The tasks fill the days, most important first, until the plan reaches 99.5% of your weekly limit. The last 0.5% is kept for incidents, and the task that doesn't fit moves to next week.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.head{font-size:17px;font-weight:600}.caption{font-size:16px}.day{font-size:14px;fill:var(--muted)}.reset{font-size:13px;fill:var(--muted)}
.title{font-size:16px;font-weight:600}.est{font-size:14px}
.p1{fill:var(--purple);fill-opacity:0.5}
.p2{fill:var(--purple);fill-opacity:0.3}
.p3{fill:var(--purple);fill-opacity:0.16}
.p4{fill:var(--purple);fill-opacity:0.08}
.later{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:6 4}.later-words{fill:var(--muted)}
.track{fill:none;stroke:var(--line);stroke-width:1.4}.day-line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.reserve{fill:var(--amber)}.pointer{stroke:var(--amber);stroke-width:2}
.arrow{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes a0{0%,3.896%{opacity:0}5.844%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a0{opacity:1;animation:a0 15.4s linear infinite}
@keyframes a1{0%,15.584%{opacity:0}17.532%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a1{opacity:1;animation:a1 15.4s linear infinite}
@keyframes a2{0%,15.584%{opacity:0}17.532%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a2{opacity:1;animation:a2 15.4s linear infinite}
@keyframes a3{0%,20.779%{opacity:0}22.727%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a3{opacity:1;animation:a3 15.4s linear infinite}
@keyframes a4{0%,25.974%{opacity:0}27.922%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a4{opacity:1;animation:a4 15.4s linear infinite}
@keyframes a5{0%,38.961%{opacity:0}40.909%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a5{opacity:1;animation:a5 15.4s linear infinite}
@keyframes a6{0%,51.948%{opacity:0}53.896%,92.857%{opacity:1}94.805%,100%{opacity:0}}
.a6{opacity:1;animation:a6 15.4s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g data-step="tokens" class="a0">
<text x="40" y="32" class="head">Tokens for this week</text>
<rect x="40" y="46" width="680" height="68" rx="7" class="track"/>
<path d="M137.1 46v68" class="day-line"/>
<path d="M234.3 46v68" class="day-line"/>
<path d="M331.4 46v68" class="day-line"/>
<path d="M428.6 46v68" class="day-line"/>
<path d="M525.7 46v68" class="day-line"/>
<path d="M622.9 46v68" class="day-line"/>
<text x="88.6" y="136" text-anchor="middle" class="day">Mon</text>
<text x="185.7" y="136" text-anchor="middle" class="day">Tue</text>
<text x="282.9" y="136" text-anchor="middle" class="day">Wed</text>
<text x="380.0" y="136" text-anchor="middle" class="day">Thu</text>
<text x="477.1" y="136" text-anchor="middle" class="day">Fri</text>
<text x="574.3" y="136" text-anchor="middle" class="day">Sat</text>
<text x="671.4" y="136" text-anchor="middle" class="day">Sun</text>
<text x="40" y="136" text-anchor="middle" class="reset">reset</text>
<text x="720" y="136" text-anchor="middle" class="reset">reset</text>
</g>
<g data-step="tasks">
<text x="40" y="176" class="caption a1">Tasks fill the days, most important first, up to 99.5%</text>
<g data-task="p1" class="a2">
<rect x="42.0" y="51" width="302.0" height="58" rx="5" class="p1"/>
<text x="54.0" y="76" class="title">Signup flow</text>
<text x="54.0" y="97" class="est">p1 · 45%</text>
</g>
<g data-task="p2" class="a3">
<rect x="348.0" y="51" width="213.6" height="58" rx="5" class="p2"/>
<text x="360.0" y="76" class="title">Profile page</text>
<text x="360.0" y="97" class="est">p2 · 32%</text>
</g>
<g data-task="p3" class="a4">
<rect x="565.6" y="51" width="149.0" height="58" rx="5" class="p3"/>
<text x="577.6" y="76" class="title">Dark mode</text>
<text x="577.6" y="97" class="est">p3 · 22.5%</text>
</g>
</g>
<g data-step="reserve" class="a5">
<rect x="716.6" y="46" width="3.4" height="68" class="reserve"/>
<path d="M718.3 37V46" class="pointer"/>
<text x="720" y="32" text-anchor="end" class="head">0.5% kept for incidents</text>
</g>
<g data-step="next-week" class="a6">
<text x="780" y="32" class="head">Moves to next week</text>
<path d="M732 80H770m-7 -6l7 6l-7 6" class="arrow"/>
<rect x="780.0" y="51" width="146.0" height="58" rx="5" class="later"/>
<text x="792.0" y="76" class="title later-words">Export</text>
<text x="792.0" y="97" class="est later-words">p4 · 9%</text>
</g>
</svg>
