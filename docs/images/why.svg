<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img" aria-label="Why teamrig is different: A built-in project manager. Plans your week and flags what's late, stuck or forgotten. Thrifty with your tokens. Lean rules, batched work, and notes that wait instead of waking anyone. Smarter every day. What one member works out becomes a skill the whole team reuses. Never loses the thread. When its memory fills up, a member hands its work over and starts fresh. Done means proven. A task closes only with evidence and a lesson the team keeps. Safe by default. Asks before it pushes to main, never force-pushes, keeps secrets out.">
<title>Why teamrig is different: A built-in project manager. Plans your week and flags what's late, stuck or forgotten. Thrifty with your tokens. Lean rules, batched work, and notes that wait instead of waking anyone. Smarter every day. What one member works out becomes a skill the whole team reuses. Never loses the thread. When its memory fills up, a member hands its work over and starts fresh. Done means proven. A task closes only with evidence and a lesson the team keeps. Safe by default. Asks before it pushes to main, never force-pushes, keeps secrets out.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.cardtitle{font-size:18px;font-weight:700}.sub{font-size:14.5px;fill:var(--muted)}
.card{fill:var(--tile);stroke:var(--line)}.chip{fill:var(--purple);fill-opacity:.12}
.icon{fill:none;stroke:var(--purple);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
