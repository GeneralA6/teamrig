<path d="M12.5 45.5V16a8 8 0 0 1 8-8h75a8 8 0 0 1 8 8V45.5" class="tab"/>
<circle cx="30" cy="27.5" r="4.5" class="working"/>
<text x="43" y="32" class="mono strong">lead</text>
<circle cx="126" cy="27.5" r="4.5" class="working"/>
<text x="139" y="32" class="mono muted">api</text>
