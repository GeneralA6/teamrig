<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-label="A lead's morning in its own tab, one plain sentence a step, each tool run folded into one line. data asks whether to rerun last night's failed import now; that is operational, so the lead decides it, sends data the answer, and data goes back to work. The week's plan holds only 7 tasks; the lead fills it to 48, fitted to the week's tokens, and the flags fall from 63 to 12. Host memory is low, 1.8 GB free, so it closes docs and tests, idle with nothing to start: 3.9 GB free, and teamrig open resumes either one. web's question is a product call, so it waits for your morning meeting.">
<title>A lead's morning in its own tab, one plain sentence a step, each tool run folded into one line. data asks whether to rerun last night's failed import now; that is operational, so the lead decides it, sends data the answer, and data goes back to work. The week's plan holds only 7 tasks; the lead fills it to 48, fitted to the week's tokens, and the flags fall from 63 to 12. Host memory is low, 1.8 GB free, so it closes docs and tests, idle with nothing to start: 3.9 GB free, and teamrig open resumes either one. web's question is a product call, so it waits for your morning meeting.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}.muted{fill:var(--muted)}.accent{fill:var(--purple)}.strong{font-weight:700}
.key{font-size:13.5px;fill:var(--muted)}
.window{fill:var(--bg);stroke:var(--line)}.strip{fill:var(--tile)}.tab{fill:var(--bg);stroke:var(--line)}
.rule,.box{fill:none;stroke:var(--line)}.bullet{fill:var(--muted)}
.working{fill:var(--green)}.needs{fill:var(--amber)}.open{fill:none;stroke:var(--muted);stroke-width:1.5}
.done{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes a0{0%,0.714%{opacity:0}1.786%,16.786%{opacity:1}17.857%,100%{opacity:0}}
.a0{opacity:0;animation:a0 28s linear infinite}
