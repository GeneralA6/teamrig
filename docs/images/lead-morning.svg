.a4{opacity:1;animation:a4 28s linear infinite}
@keyframes a5{0%,12.143%{opacity:0;transform:translateY(5px)}13.214%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a5{opacity:1;animation:a5 28s linear infinite}
@keyframes a6{0%,15.714%{opacity:0;transform:translateY(5px)}16.786%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a6{opacity:1;animation:a6 28s linear infinite}
@keyframes a7{0%,25.000%{opacity:0;transform:translateY(5px)}26.071%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a7{opacity:1;animation:a7 28s linear infinite}
@keyframes a8{0%,34.286%{opacity:0;transform:translateY(5px)}35.357%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a8{opacity:1;animation:a8 28s linear infinite}
@keyframes a9{0%,38.571%{opacity:0;transform:translateY(5px)}39.643%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a9{opacity:1;animation:a9 28s linear infinite}
@keyframes a10{0%,51.429%{opacity:0;transform:translateY(5px)}52.500%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a10{opacity:1;animation:a10 28s linear infinite}
@keyframes a11{0%,60.000%{opacity:0;transform:translateY(5px)}61.071%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a11{opacity:1;animation:a11 28s linear infinite}
@keyframes a12{0%,65.714%{opacity:0;transform:translateY(5px)}66.786%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a12{opacity:1;animation:a12 28s linear infinite}
@keyframes a13{0%,76.429%{opacity:0;transform:translateY(5px)}77.500%,95.357%{opacity:1;transform:translateY(0)}96.429%,100%{opacity:0;transform:translateY(5px)}}
.a13{opacity:1;animation:a13 28s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
