<g class="a9"><text x="24" y="86" class="mono">Claude Code sessions the last shutdown interrupted (4):</text></g>
<g class="a10"><text x="40" y="110" class="mono">shop-lead [killed without exiting; continue: lead] D:\code\shop</text></g>
<g class="a11"><text x="40" y="132" class="mono">shop-api [killed without exiting; continue: mid-turn] D:\code\shop-api</text></g>
<g class="a12"><text x="40" y="154" class="mono">shop-web [closed by the shutdown; idle] D:\code\shop-web</text></g>
<g class="a13"><text x="40" y="176" class="mono">shop-data [closed by the shutdown; continue: 1 cron job] D:\code\shop-data</text></g>
<g class="a14"><text x="24" y="206" class="mono muted">Sessions marked &quot;continue&quot; resume with a message to re-check the state and carry on</text></g>
<g class="a15"><text x="24" y="228" class="mono muted">(mid-turn, an API error, work live at the shutdown, or the lead); the others reopen idle, with no prompt.</text></g>
<g class="a16"><text x="24" y="258" class="mono">Starting in 60s [Enter] start now [i] reopen all with no prompt [q] cancel</text></g>
<g class="a17"><text x="24" y="288" class="mono">Opened shop-lead (continue: lead)</text></g>
<g class="a18"><text x="24" y="310" class="mono">Opened shop-api (continue: mid-turn)</text></g>
<g class="a19"><text x="24" y="332" class="mono">Opened shop-web (idle)</text></g>
<g class="a20"><text x="24" y="354" class="mono">Opened shop-data (continue: 1 cron job)</text></g>
<g class="a21">
<text x="24" y="86" class="mono accent">&gt;</text>
<text x="42" y="86" class="mono">The computer restarted (update or power loss) and this session was restored automatically. …</text>
<text x="42" y="108" class="mono">Other sessions restored: shop-api continue (mid-turn), shop-web idle, shop-data continue (1 cron job).</text>
</g>
<g class="a22">
<text x="42" y="144" class="mono muted">Ran 4 shell commands</text>
</g>
<g class="a23">
<circle cx="28.5" cy="175.5" r="3.5" class="bullet"/>
<text x="42" y="180" class="mono">Back after the restart: api and data carry on where they stopped, and web reopened idle.</text>
</g>
<g class="a24">
<circle cx="28.5" cy="211.5" r="3.5" class="bullet"/>
<text x="42" y="216" class="mono">Tasks, notes and inboxes were on disk, so nothing was lost. On with the plan.</text>
</g>
