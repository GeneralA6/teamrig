<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-label="After a reboot, a tab named Restore Claude sessions opens at logon and lists the 4 Claude Code sessions the shutdown killed, each with its folder: the lead, api mid-turn, web with nothing going and data with a cron job live. Those marked continue resume with a message to re-check the state and carry on; web reopens idle, with no prompt. After a countdown you can cut short or cancel, each one reopens in its own tab, and the restore tab closes by itself. In the lead's tab, its first prompt says how its team came back. The lead re-checks the state, says api and data carry on and web reopened idle, and goes on with the plan: tasks, notes and inboxes were on disk, so nothing was lost.">
<title>After a reboot, a tab named Restore Claude sessions opens at logon and lists the 4 Claude Code sessions the shutdown killed, each with its folder: the lead, api mid-turn, web with nothing going and data with a cron job live. Those marked continue resume with a message to re-check the state and carry on; web reopens idle, with no prompt. After a countdown you can cut short or cancel, each one reopens in its own tab, and the restore tab closes by itself. In the lead's tab, its first prompt says how its team came back. The lead re-checks the state, says api and data carry on and web reopened idle, and goes on with the plan: tasks, notes and inboxes were on disk, so nothing was lost.</title>
<style>
:root{--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--tile:#f6f8fa;--bg:#ffffff;--purple:#8250df;--tint:#f0eafb;--amber:#9a6700;--green:#1a7f37}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--tile:#151b23;--bg:#0d1117;--purple:#a371f7;--tint:#221e36;--amber:#d29922;--green:#3fb950}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13.5px}.muted{fill:var(--muted)}.accent{fill:var(--purple)}.strong{font-weight:700}
.key{font-size:13.5px;fill:var(--muted)}
.window{fill:var(--bg);stroke:var(--line)}.strip{fill:var(--tile)}.tab{fill:var(--bg);stroke:var(--line)}
.rule,.box{fill:none;stroke:var(--line)}.bullet{fill:var(--muted)}
.working{fill:var(--green)}.needs{fill:var(--amber)}.open{fill:none;stroke:var(--muted);stroke-width:1.5}
.done{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
