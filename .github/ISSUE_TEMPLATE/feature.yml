name: Feature request
description: A new capability, or a change in how teamrig behaves.
title: "<area>: <the capability>"
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Read the guide first: https://github.com/teamrig/teamrig/blob/main/docs/issues-and-pull-requests.md
        Each section becomes part of the task teamrig tracks for this issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, or what costs too much, with an example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What teamrig should do, as you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered or use today, if any.
    validations:
      required: false
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: What could go wrong (a break for someone relying on today's behaviour, a security or data risk, a cost, a migration) and how each is softened, or "none foreseen" and why.
    validations:
      required: true
