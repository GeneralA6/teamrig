name: codeql

# Scans the TypeScript and JavaScript for security flaws (CodeQL's security-extended queries) on each pull request,
# each push to main, and weekly, since a new query can find a flaw in code that has not changed. Findings show in the
# repository's Security tab and on the pull request. It is not one of the checks main requires: a finding is read
# and fixed by a person, not by a red merge button. The plugin's dist is skipped: it is compiled from the source
# scanned here, so it would report each finding twice.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # security-events: write uploads the findings; a job's permissions replace the workflow's, so contents: read is restated.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - plugins/teamrig/dist
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
