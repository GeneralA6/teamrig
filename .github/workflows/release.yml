name: release

on:
  # Each merge to main updates the release pull request; merging that one tags main and publishes the release.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      main-as-is:
        description: Publish main's commit at the version its plugin.json holds, without a release pull request (the first release)
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and never one cancelled half-way between its tag and its build.
concurrency:
  group: release
  cancel-in-progress: false

# Each job stops after 20 minutes (timeout-minutes), as in ci.yml.
jobs:
  release-please:
    name: release pull request
    # release-please keeps one pull request open that raises the version in plugin.json and src/core/version.ts
    # (release-please-config.json) and writes the notes from the commits since the last release. It merges like any
    # pull request, through tools/ship: `ship.ts merge --release` on the lead's approval of a release task at its head,
    # refusing anything but the version raises and the notes. Once it merged, the next run tags main's commit teamrig-v<version>,
    # publishes the notes as a GitHub release, and the jobs below build and publish the plugin.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' && !inputs.main-as-is }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A job's permissions replace the workflow's: contents to tag and commit the raise, pull-requests to open the
    # release pull request, actions to run ci.yml on it (below).
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request the workflow's own token opens or updates starts no workflow, so the required check would
      # never report on it. A run by hand is the one event that token may start: ci.yml runs on the release branch's
      # head, where the pull request reads its checks. The pull request goes in as a plain value and the script reads
      # its branch: GitHub reads a step's env even when its `if` skips it, and fromJSON of a run's empty pr output
      # fails the whole job.
      - name: run ci on the release pull request
        if: ${{ steps.release.outputs.pr != '' }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$(node -p 'JSON.parse(process.env.PR).headBranchName')"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}

  build:
    name: build the plugin
    # Runs the build's npm packages with a read-only token, so no package code ever holds the token that pushes.
    # It builds the commit release-please just tagged, or, on a run by hand with main-as-is, main's own commit; the
    # version is the one that commit's plugin.json holds, which the release pull request raised.
    needs: release-please
    if: ${{ always() && !github.event.repository.private && github.ref == 'refs/heads/main' && (needs.release-please.outputs.release_created == 'true' || (inputs.main-as-is && needs.release-please.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - id: version
        run: node tools/release/version-cli.ts --expect "$EXPECTED" >> "$GITHUB_OUTPUT"
        env:
          EXPECTED: ${{ needs.release-please.outputs.version }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Runs the launcher and every hook from the dist, as an installed plugin runs them.
      - run: node tools/ci/dist-smoke-cli.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: plugins/teamrig/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish to the release branch
    # The marketplace entry installs from the release branch: main's released commit with the dist built above on
    # top, tagged v<version> (tools/release/publish.ts). It runs no npm package, only the repo's own reviewed code.
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The rulesets let one actor create or move the release branch and a v<version> tag: a deploy key, whose private
    # half is a secret of the release environment, which only main may use. The checkout keeps that key for the
    # push; the job's own token stays read-only, so it can push nothing.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - run: rm -rf plugins/teamrig/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: plugins/teamrig/dist
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node tools/release/publish-cli.ts --version "$VERSION" --source "$SOURCE"
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE: ${{ needs.build.outputs.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
