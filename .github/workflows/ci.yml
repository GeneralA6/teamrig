name: ci

on:
  # Runs on each pull request, each merge queue group and each push to main. Every job would skip if the repository
  # were made private again, where Actions minutes bill. Every check below that can run on a machine also runs before
  # each push, through the pre-push hook (tools/ci/local.ts, list in tools/ci/local-checks.ts). A pull request from a
  # fork runs with no secrets and the read-only token below.
  push:
    branches: [main]
  pull_request:
  # A queued pull request lands only once its group, its commits on the newest main with those queued ahead of it,
  # passed the same required check (T3386). The gates read the group's range, base_sha..head_sha (github-range.ts).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job stops after 20 minutes (timeout-minutes), well past the slowest run, so a hung test fails its job
# instead of holding the required check pending for GitHub's 6-hour default.
jobs:
  changes:
    name: change kind
    # Names the run's change code, docs or design (tools/ci/change-kind.ts, T4617). A docs change runs the commit
    # checks, then on ubuntu alone the specs and checks that hold the docs to the code; a design change only the
    # commit checks and the docs' links. The jobs skip their steps, never themselves, so each still passes and the
    # summary keeps failing any job that skipped. Never a workflow-level paths filter: the required check would
    # never report.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      systems: ${{ steps.kind.outputs.systems }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # The classifier runs from the base commit, never from the change: a pull request's own tools/ci could name
      # itself docs and skip the tests. With no base to check out (a new branch, a run by hand, a rewritten push) or
      # a base from before the classifier, the run is code, on every system (TEST_SYSTEMS in tools/ci/change-kind.ts).
      - id: kind
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA" && [ -f "$RUNNER_TEMP/base/tools/ci/change-kind-cli.ts" ]; then
            node "$RUNNER_TEMP/base/tools/ci/change-kind-cli.ts" --github
          else
            echo "change-kind: code: no base classifier to run, every check runs"
            printf 'kind=code\nsystems=%s\n' '["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  gates:
    name: scrub and DCO gates
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/scrub/cli.ts --tree
      - run: node tools/scrub/cli.ts --github
      - run: node tools/dco/cli.ts --github

  dependency-review:
    name: dependency review
    # Fails a pull request that adds or changes a dependency (an npm package or a GitHub Action) with a known
    # advisory of any severity, dev dependencies included: they run at install and build time too. It reads
    # GitHub's dependency graph, so it needs no checkout. A push to main, a merge queue group (its pull requests
    # each passed it) or a run by hand has no pull request to compare, so the step skips there and the job passes.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  size-rule:
    name: commit size rule
    # Fails a commit over 400 changed non-test lines or 15 non-test files whose message has no
    # Large-commit: <reason> line, the push guard's rule (see CONTRIBUTING.md).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/size-rule-cli.ts --github

  commit-subjects:
    name: commit subject gate
    # Fails a commit whose subject is not <type>(<area>): <what>, a Conventional Commit: the release workflow
    # raises the version from main's subjects, and a pull request is rebase-merged with its commits as they are
    # (see CONTRIBUTING.md). A run by hand checks its head commit alone.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/commit-subjects-cli.ts --github

  coverage:
    name: coverage gate
    # Fails on a failing, skipped or todo test, a source file no test loads, or a file or total
    # below the floors in tools/ci/coverage.json (see CONTRIBUTING.md). A docs or design change has no code to
    # cover: every step skips and the job passes.
    needs: changes
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: ${{ needs.changes.outputs.kind == 'code' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ needs.changes.outputs.kind == 'code' }}
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # Specs load the built plugin (its hooks, launcher and integrity list), which main does not carry.
      - run: npm run build
        if: ${{ needs.changes.outputs.kind == 'code' }}
      - run: node tools/ci/coverage-cli.ts
        if: ${{ needs.changes.outputs.kind == 'code' }}

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # A code change is tested on all three OSes, since paths, renames and hook launch differ by OS (macOS minutes
    # bill at 10x, Windows at 2x). Node 22 only, to ease the shared free GitHub runners. A docs or design change
    # changes no code, so it runs on ubuntu alone, only the steps its kind names; the runners come from change kind
    # above (TEST_SYSTEMS in tools/ci/change-kind.ts).
    needs: changes
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.systems) }}
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        if: ${{ needs.changes.outputs.kind != 'design' }}
      - run: npm run typecheck
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # Before the tests: specs load the built plugin (its hooks, launcher and integrity list).
      - run: npm run build
        if: ${{ needs.changes.outputs.kind != 'design' }}
      - run: npm test
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # A docs change runs only the specs that hold the docs to the code: tools/docs/, and SECURITY.md's.
      - run: node --test "tools/docs/*.test.ts" tools/ci/security-workflows.test.ts
        if: ${{ needs.changes.outputs.kind == 'docs' }}
      # Runs the launcher and every hook from the dist, as an installed plugin runs them.
      - run: node tools/ci/dist-smoke-cli.ts
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # A new developer's first run: a clone with no login, a bare teamrig on the PATH, a new team on a new project, every hook.
      - run: node tools/ci/fresh-install-cli.ts
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # The docs' pictures are drawn in code, the commands screen from the CLI's real output; they must match on every OS.
      - run: node tools/docs/images-cli.ts --check
        if: ${{ needs.changes.outputs.kind != 'design' }}
      # The configuration reference is drawn from the config schema; it must match the committed page.
      - run: node tools/docs/configuration-cli.ts --check
        if: ${{ needs.changes.outputs.kind != 'design' }}
      # The parity page is drawn from what each adapter declares and the feature registry; it must match the committed
      # page, on a docs change too, which could edit the page by hand.
      - run: node tools/docs/parity-cli.ts --check
        if: ${{ needs.changes.outputs.kind != 'design' }}
      # The layer boundaries of src (what the core and an adapter import, who imports an adapter, where a tool is named): counted, failing nothing in warn mode.
      # A docs or design change touches no file under src, so only a code change runs it.
      - run: node tools/ci/boundaries-cli.ts
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # The host and tool words in each skill (plugins/teamrig/skills, .claude/skills): a count may fall, never rise
      # over tools/ci/provider-words.json. Skills are code to the change kind, so only a code change runs it.
      - run: node tools/ci/provider-words-cli.ts
        if: ${{ needs.changes.outputs.kind == 'code' }}
      # Every link, anchor and Mermaid block in the Markdown must resolve on every OS; a design change's too, as
      # docs/design/ is Markdown a reader follows.
      - run: node tools/docs/doc-check-cli.ts

  summary:
    name: every check passed
    # The one check main's ruleset requires, so a grown test matrix or a new job here (added to needs, which
    # tools/ci/ci-workflow.test.ts holds to every job) needs no ruleset change. It fails when any job it needs
    # failed, was cancelled or skipped; always() runs it after a failed one, where a job would skip, which
    # a required check reads as a pass.
    if: ${{ always() && !github.event.repository.private }}
    needs: [changes, gates, dependency-review, size-rule, commit-subjects, coverage, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: read lists this run's jobs; a job's permissions replace the workflow's, so contents: read is restated.
    permissions:
      actions: read
      contents: read
    steps:
      - name: fail unless every job it needs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # needs.test.result folds the matrix into one result, which stayed a success when a macOS leg was
      # cancelled because no runner took it; the jobs API lists each leg, so every one must have passed.
      - name: fail unless every job of the run passed, each matrix leg alone
        run: node tools/ci/every-check-cli.ts "every check passed"
        env:
          GH_TOKEN: ${{ github.token }}
