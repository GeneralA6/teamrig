name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: scrub and DCO gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/scrub/cli.ts --tree
      - run: node tools/scrub/cli.ts --github
      - run: node tools/dco/cli.ts --github

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # Pushes to dev test on Linux only; main and pull requests run the full matrix
    # (macOS minutes bill at 10x, Windows at 2x).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/dev' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The plugin ships its compiled dist; it must match the source on every OS.
      - run: npm run build
      - run: node tools/ci/dist-fresh-cli.ts
