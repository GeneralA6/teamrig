name: ci

on:
  # Paused until CI is turned back on: it runs only when started by hand, and every check below runs
  # before each push instead, through the pre-push hook (tools/ci/local.ts, list in tools/ci/local-checks.ts).
  # To turn it back on, put back these triggers in place of workflow_dispatch:
  #   push:
  #     branches: [main]
  #   pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: scrub and DCO gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/scrub/cli.ts --tree
      - run: node tools/scrub/cli.ts --github
      - run: node tools/dco/cli.ts --github

  coverage:
    name: coverage gate
    # Fails on a failing, skipped or todo test, a source file no test loads, or a file or total
    # below the floors in tools/ci/coverage.json (see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node tools/ci/coverage-cli.ts

  plugin-version:
    name: plugin version gate
    # Fails a change under the plugin's folder that does not raise the version in its plugin.json
    # above the base's (installs update only when it rises), and a version in a marketplace entry,
    # which Claude Code ignores (see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/plugin-version-cli.ts --github

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # Each run tests all three OSes on node 22 and 24, since paths,
    # renames and hook launch differ by OS (macOS minutes bill at 10x, Windows at 2x).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The plugin ships its compiled dist; it must match the source on every OS.
      - run: npm run build
      - run: node tools/ci/dist-fresh-cli.ts
      # Runs the launcher and every hook from the dist, as an installed plugin runs them.
      - run: node tools/ci/dist-smoke-cli.ts
      # The docs' pictures are drawn in code, the commands screen from the CLI's real output; they must match on every OS.
      - run: node tools/docs/images-cli.ts --check
      # The configuration reference is drawn from the config schema; it must match the committed page.
      - run: node tools/docs/configuration-cli.ts --check
      # Every link, anchor and Mermaid block in the Markdown must resolve on every OS.
      - run: node tools/docs/doc-check-cli.ts
