name: ci

on:
  # Runs on each pull request and each push to main, but every job skips while the repository is private,
  # where Actions minutes bill: it checks once the repository is public, where they are free. Until then
  # every check below runs before each push instead, through the pre-push hook (tools/ci/local.ts, list in
  # tools/ci/local-checks.ts). A pull request from a fork runs with no secrets and the read-only token below.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job stops after 20 minutes (timeout-minutes), well past the slowest run, so a hung test fails its job
# instead of holding the required check pending for GitHub's 6-hour default.
jobs:
  gates:
    name: scrub and DCO gates
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/scrub/cli.ts --tree
      - run: node tools/scrub/cli.ts --github
      - run: node tools/dco/cli.ts --github

  size-rule:
    name: commit size rule
    # Fails a commit over 400 changed non-test lines or 15 non-test files whose message has no
    # Large-commit: <reason> line, the push guard's rule (see CONTRIBUTING.md).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/size-rule-cli.ts --github

  coverage:
    name: coverage gate
    # Fails on a failing, skipped or todo test, a source file no test loads, or a file or total
    # below the floors in tools/ci/coverage.json (see CONTRIBUTING.md).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node tools/ci/coverage-cli.ts

  plugin-version:
    name: plugin version gate
    # Fails a change under the plugin's folder that does not raise the version in its plugin.json
    # above the base's (installs update only when it rises), and a version in a marketplace entry,
    # which Claude Code ignores (see CONTRIBUTING.md).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: node tools/ci/plugin-version-cli.ts --github

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    # Each run tests all three OSes, since paths, renames and hook launch differ by OS (macOS minutes
    # bill at 10x, Windows at 2x). Node 22 only, to ease the shared free GitHub runners.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # The plugin ships its compiled dist; it must match the source on every OS.
      - run: npm run build
      - run: node tools/ci/dist-fresh-cli.ts
      # Runs the launcher and every hook from the dist, as an installed plugin runs them.
      - run: node tools/ci/dist-smoke-cli.ts
      # The docs' pictures are drawn in code, the commands screen from the CLI's real output; they must match on every OS.
      - run: node tools/docs/images-cli.ts --check
      # The configuration reference is drawn from the config schema; it must match the committed page.
      - run: node tools/docs/configuration-cli.ts --check
      # Every link, anchor and Mermaid block in the Markdown must resolve on every OS.
      - run: node tools/docs/doc-check-cli.ts

  summary:
    name: every check passed
    # The one check main's ruleset requires, so a grown test matrix or a new job here (added to needs, which
    # tools/ci/ci-workflow.test.ts holds to every job) needs no ruleset change. It fails when any job it needs
    # failed, was cancelled or skipped; always() runs it after a failed one, where a job would skip, which
    # a required check reads as a pass.
    if: ${{ always() && !github.event.repository.private }}
    needs: [gates, size-rule, coverage, plugin-version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: read lists this run's jobs; a job's permissions replace the workflow's, so contents: read is restated.
    permissions:
      actions: read
      contents: read
    steps:
      - name: fail unless every job it needs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      # needs.test.result folds the matrix into one result, which stayed a success when a macOS leg was
      # cancelled because no runner took it; the jobs API lists each leg, so every one must have passed.
      - name: fail unless every job of the run passed, each matrix leg alone
        run: node tools/ci/every-check-cli.ts "every check passed"
        env:
          GH_TOKEN: ${{ github.token }}
